global_objects:
  credential_profiles:
    default:
      shared_secret: shared-secret
  authentication_profiles:
    default:
      simultaneous_use: 1
  accounting_profiles:
    default: {}
  monitoring_profiles:
    default: {}
  deployment_profiles:
    default:
      template: default
      overlays: []
  nas_devices:
    mt-core-01.gobcn.ca:
      ip_address: 10.10.10.1
      vendor: mikrotik
  trusted_radius_clients:
    sonar:
      ip_address: 10.10.10.2

tenants:
  customer-a:
    authentication_profile: default
    deployment_profile: default
    database:
      engine: mysql
      deployment: container
      # if deployment is not container, host and port must be specified
      # host: db.example.com
      # port: 3306
      database: radius
      username: radius
      password: password
    radius_server:
      version: 3.2.10
      authentication_port: 1812
      accounting_port: 1813
      coa_port: 3799
    nas_assignments:
      mt-core-01.gobcn.ca:
        credential_profile: default
        accounting_profile: default
        monitoring_profile: default
        require_message_authenticator: yes
    trusted_radius_client_assignments:
      sonar:
        credential_profile: default
        require_message_authenticator: no
