#########################################################################
#
# Managed client definitions
#
# The following client definitions are generated by RADIUS Director.
#
#########################################################################

# Tenant: {{ .Identifier }}

{{- range .FreeRADIUSClients }}
client {{ .Identifier }} {
    ipaddr = {{ .IPAddress }}
    secret = {{ .SharedSecret }}
{{ if .RequireMessageAuthenticator }}
    require_message_authenticator = {{ .RequireMessageAuthenticator }}
{{ end }}
    nas_type = {{ if eq .Vendor "mikrotik" }}mikrotik_snmp{{ else }}other{{ end }}
    coa_server = concentrators
}

{{- end }}
