{{ $root := . }}
services:
{{ if .ProxySQL }}
  {{ .ProxySQL.ServiceName }}:
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "127.0.0.1:6033"]
      interval: 10s
      timeout: 5s
      retries: 3
    image: proxysql/proxysql:latest
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf:ro
{{ if .RuntimeNetworkName }}
    networks:
      - radius-director

{{ end }}
{{ end }}
{{ range .Tenants }}
  {{ .ServiceName }}:
    image: freeradius/freeradius-server:{{ .RadiusVersion }}
{{ if eq .DatabaseDeployment "container" }}
    depends_on:
      {{ .DatabaseServiceName }}:
        condition: service_healthy
{{ else if eq .DatabaseDeployment "proxysql" }}
    depends_on:
      proxysql:
        condition: service_healthy
{{ end }}
    volumes:
      - ./{{ .Name }}:/opt/radius-director/tenant:ro
      - ./entrypoint.sh:/usr/local/bin/radius-director-entrypoint:ro
    entrypoint:
      - /usr/local/bin/radius-director-entrypoint
{{ if $root.RuntimeNetworkName }}
    networks:
      - radius-director
{{ end }}

{{ if eq .DatabaseDeployment "container" }}
  {{ .DatabaseServiceName }}:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: {{ .DatabaseName }}
      MYSQL_USER: {{ .DatabaseUsername }}
      MYSQL_PASSWORD: {{ .DatabasePassword }}
    volumes:
      - {{ .DatabaseVolumeName }}:/var/lib/mysql
      - ./{{ .Name }}/database/schema.sql:/docker-entrypoint-initdb.d/01-radius-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
{{ if $root.RuntimeNetworkName }}
    networks:
      - radius-director
{{ end }}
{{ end }}
{{ end }}

{{ if .HasContainerDatabase }}
volumes:
{{ range .Tenants }}
{{ if eq .DatabaseDeployment "container" }}
  {{ .DatabaseVolumeName }}:
{{ end }}
{{ end }}
{{ end }}

{{ if .RuntimeNetworkName }}
networks:
  radius-director:
    external: true
    name: {{ .RuntimeNetworkName }}
{{ end }}
